<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Draggable</title>
    <link rel="stylesheet" href="calculator.css">
    <style>
        body {
            background-image: url("tapeta.jpg");
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
        }
    </style>
</head>
<body>
    <div class="calculator" id="myWindow">
        <div class="topBar" id="myTitleBar">
            <div class="leftItems">
                <div class="appName"><img src="logo.png" height="16"></div>
                <div class="appName">Kalkulator</div>
            </div>

            <div class="rightItems">
                <div class="buttonTop buttonTopMnMax">—</div>
                <div class="buttonTop buttonTopMnMax">☐</div>
                <div class="buttonTop buttonTopClose" style="border-radius: 0 7px 0 0;">✕</div>
            </div>
        </div>

        <div class="screen">
        </div>

        <div class="calculatorKeyboard">
            <div class="button buttonDark">%</div>
            <div class="button buttonDark">CE</div>
            <div class="button buttonDark">C</div>
            <div class="button buttonDark">⌫</div>

            <div class="button buttonDark">1/x</div>
            <div class="button buttonDark">x²</div>
            <div class="button buttonDark">√</div>
            <div class="button buttonDark mathBigFont">÷</div>

            <div class="button buttonBright">7</div>
            <div class="button buttonBright">8</div>
            <div class="button buttonBright">9</div>
            <div class="button buttonDark mathBigFont">×</div>

            <div class="button buttonBright">4</div>
            <div class="button buttonBright">5</div>
            <div class="button buttonBright">6</div>
            <div class="button buttonDark mathBigFont">-</div>

            <div class="button buttonBright">1</div>
            <div class="button buttonBright">2</div>
            <div class="button buttonBright">3</div>
            <div class="button buttonDark mathBigFont">+</div>

            <div class="button buttonBright">+/-</div>
            <div class="button buttonBright">0</div>
            <div class="button buttonBright">,</div>
            <div class="button buttonBlue">=</div>
        </div>
    </div>
    <!--<script src="movableBox.js"></script>-->
</body>
</html>
