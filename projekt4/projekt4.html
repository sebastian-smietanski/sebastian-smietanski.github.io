<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Kalkulator</title>
    <link rel="icon" type="image/x-icon" href="../icons/favicon.ico">
    <title>Custom Draggable</title>
    <link rel="stylesheet" href="calculator.css">
    <style>
        body {
            background-image: url("tapeta.jpg");
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
        }
    </style>
</head>
<body>
    <div class="calculator" id="myWindow">
        <div class="topBar" id="myTitleBar">
            <div class="leftItems">
                <div class="appName"><img src="logo.png" height="16"></div>
                <div class="appName">Kalkulator</div>
            </div>

            <div class="rightItems">
                <div class="buttonTop buttonTopMnMax">—</div>
                <div class="buttonTop buttonTopMnMax">☐</div>
                <div class="buttonTop buttonTopClose" style="border-radius: 0 7px 0 0;" onclick="exitButton()">✕</div>
            </div>
        </div>

        <div class="uselessBar">
            <div class="leftItems">
                <div class="uselessButton" style="font-size:40px"><div class="squeeze">≡</div></div>
                <div class="uselessName">Standardowy</div>
                <div class="uselessButton">↗</div>
            </div>
            <div class="rightItems">
                <div class="uselessButton" onclick="reloadButton()">⟲</div>
            </div>
        </div>

        <div class="screen">
            <div class="history" id="history"></div>
            <div class="input" id="input">0</div>
        </div>

        <div class="MButtonBar">
            <div class="disabled MButton">MC</div>
            <div class="disabled MButton">MR</div>
            <div class="disabled MButton">M+</div>
            <div class="disabled MButton">M-</div>
            <div class="disabled MButton">MS</div>
            <div class="disabled MButton">M˅</div>
        </div>

        <div class="calculatorKeyboard" id="calculatorKeyboard">
            <div class="button mathSmallFont">%</div>
            <div class="button mathSmallFont buttonDark" onclick="clearEntryButton()">CE</div>
            <div class="button mathSmallFont buttonDark" onclick="clearEverythingButton()">C</div>
            <div class="button mathSmallFont buttonDark" onclick="removeButton()">⌫</div>

            <div class="button mathSmallFont ">⅟x</div>
            <div class="button mathSmallFont ">x²</div>
            <div class="button mathSmallFont ">√</div>
            <div class="button buttonDark mathBigFont" onclick="operationButton(this)">÷</div>

            <div class="button buttonBright" onclick="numberButton(this)">7</div>
            <div class="button buttonBright" onclick="numberButton(this)">8</div>
            <div class="button buttonBright" onclick="numberButton(this)">9</div>
            <div class="button buttonDark mathBigFont" onclick="operationButton(this)">×</div>

            <div class="button buttonBright" onclick="numberButton(this)">4</div>
            <div class="button buttonBright" onclick="numberButton(this)">5</div>
            <div class="button buttonBright" onclick="numberButton(this)">6</div>
            <div class="button buttonDark mathBigFont" onclick="operationButton(this)">-</div>

            <div class="button buttonBright" onclick="numberButton(this)">1</div>
            <div class="button buttonBright" onclick="numberButton(this)">2</div>
            <div class="button buttonBright" onclick="numberButton(this)">3</div>
            <div class="button buttonDark mathBigFont" onclick="operationButton(this)">+</div>

            <div class="button" onclick="">±</div>
            <div class="button buttonBright" onclick="numberButton(this)">0</div>
            <div class="button buttonBright" onclick="commaButton()">,</div>
            <div class="button buttonBlue" onclick="evalButton()">=</div>
        </div>
    </div>
    <!--<script src="movableBox.js"></script>-->
    <script src="movableBox.js"></script>
    <script src="calculator.js"></script>
</body>
</html>
