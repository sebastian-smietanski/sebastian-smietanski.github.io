<!DOCTYPE html>
<html  lang="pl">
	<head>
		<meta charset="UTF-8">
		<title>BSI Projekt 3: Galeria</title>
		<link rel="icon" type="image/x-icon" href="../icons/favicon.ico">
		<link rel="stylesheet" href="style.css">
		<style>
			.background {
				z-index: -1;
				position: fixed;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				object-fit: cover;
				
				filter: blur(10px);			
			}
			
			body {
				background-color: #2c4c3b;
			}
			
			.imggallery {
				justify-content: center;
				display: flex;
				flex-direction: row;
				flex-wrap: wrap;
			}
			
			.imgbox {
				padding: 40px 40px 0px 40px;
				margin: 20px;
				background-color: white;
				background: rgba(255, 255, 255, 0.3);
				backdrop-filter: blur(15px); 
				border-radius: 20px;
			}
			
			.img {
				height: 600px;
				border-radius: 5px;
			}
			
			.img:hover {
				transform: scale(1.01);
			}
			
			.imgcaptin {
				margin-top: 60px;
				margin-bottom: 40px;
				align-items: flex-end;
			}
			
		</style>
	</head>
	<body>
		<img src="..\obrazy/banbus.jpg" class="background">
		
		<h2 class="header">Galeria</h2>
		
		<div class="imggallery"> 
			<div class="imgbox">
				<img src="..\obrazy/monalisa.png" alt="Mona Lisa" class="img"> 
				<p class="imgcaptin"> Mona Lisa, Leonardo da Vinci </p>
			</div>
			<div class="imgbox">
				<img src="..\obrazy/narodzinywanus.png" alt="Narodziny Wenus" class="img"> 
				<p class="imgcaptin"> Narodziny Wenus, Sandro Botticelli </p>
			</div>
			
			
			<div class="imgbox">
				<img src="..\obrazy/ostatniawieczerza.png" alt="Ostatnia wieczerza" class="img"> 
				<p class="imgcaptin"> Ostatnia wieczerza, Leonardo da Vinci </p>
			</div>
			<div class="imgbox">
				<img src="..\obrazy/sloneczniki.png" alt="Słoneczniki" class="img"> 
				<p class="imgcaptin"> Słoneczniki, Vincent van Gogh </p>
			</div>
			
			
			<div class="imgbox">
				<img src="..\obrazy/mleczarka.png" alt="Mleczarka" class="img"> 
				<p class="imgcaptin"> Mleczarka, Jan Vermeer </p>
			</div>
			<div class="imgbox">
				<img src="..\obrazy/stworzenieadama.png" alt="Stworzenie Adama" class="img"> 
				<p class="imgcaptin"> Stworzenie Adama, Michał Anioł </p>
			</div>
			
			
			<div class="imgbox">
				<img src="..\obrazy/miekkiezegary.png" alt="Miękkie zegary" class="img"> 
				<p class="imgcaptin"> Miękkie zegary, Salvadore Dali </p>
			</div>
		</div>
	</body>
</html>
