<!DOCTYPE html>
<html  lang="pl">
	<head>
		<meta charset="UTF-8">
		<title>BSI Projekt 3: Galeria</title>
		<link rel="icon" type="image/x-icon" href="../icons/favicon.ico">
		<link rel="stylesheet" href="style.css">
		<style>
			.background {
				z-index: -1;
				position: fixed;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				object-fit: cover;
				
				filter: blur(10px);			
			}
			
			body {
				background-color: #2c4c3b;
			}
			
			.imggallery {
				display: flex;
				flex-direction: row;
			}
			
			.imgbox {
				padding: 40px 40px 0px 40px;
				margin: 20px;
				background-color: white;
				background: rgba(255, 255, 255, 0.3);
				backdrop-filter: blur(15px); 
				border-radius: 20px;
			}
			
			.img {
				width: 400px;
				border-radius: 5px;
			}
			
			.img:hover {
				transform: scale(1.01);
			}
			
			.imgcaptin {
				margin-top: 60px;
				margin-bottom: 40px;
			}
			
		</style>
	</head>
	<body>
		<img src="..\obrazy/banbus.jpg" class="background">
		
		<h2 class="header">Galeria</h2>
		
		<div class="imggallery"> 
			<div class="imgbox">
				<img src="..\obrazy/sloneczniki.png" alt="Obraz: Mona Lisa, Leonardo da Vinci" class="img"> 
				<p class="imgcaptin"> xd xd xd </p>
			</div>
		</div>
		
		<div class="imggallery"> 
			<div class="imgbox">
				<img src="..\obrazy/sloneczniki.png" alt="Obraz: Mona Lisa, Leonardo da Vinci" class="img"> 
				<p class="imgcaptin"> xd xd xd </p>
			</div>
		</div>
	</body>
</html>
