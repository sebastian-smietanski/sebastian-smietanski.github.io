<div id="myDiv">Initial text</div>

<script>
    const targetDiv = document.getElementById('myDiv');

    // Define the function that runs on change
    function onTextChange() {
        console.log('Text changed to:', targetDiv.textContent);
    }

    // Create a MutationObserver to watch for changes
    const observer = new MutationObserver(mutations => {
        mutations.forEach(mutation => {
            if (mutation.type === 'childList' || mutation.type === 'characterData') {
                onTextChange();
            }
        });
    });

    // Start observing the div for changes in text or child elements
    observer.observe(targetDiv, {
        childList: true,        // detect added/removed nodes
        characterData: true,    // detect text content changes
        subtree: true           // include descendants
    });
</script>
